name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deployment-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_deploy.py' -v
      - run: python -m unittest discover -s tests -p 'test_bootstrap.py' -v
      - run: python -m unittest discover -s tests -p 'test_field.py' -v
      - run: python -m unittest discover -s tests -p 'test_source_distribution.py' -v
      - run: python -m unittest discover -s tests -p 'test_backup*.py' -v
  model-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # These tests use fake weights and local mocked transports, without MLX.
      # Read exact direct dependency pins from the application lock.
      - run: |
          python - <<'PYTHON'
          import pathlib, subprocess, sys
          wanted = {'numpy', 'pydantic-ai-slim', 'openai', 'httpx2'}
          pins = [line.strip() for line in pathlib.Path('requirements.lock.txt').read_text().splitlines() if line.split('==')[0] in wanted]
          assert len(pins) == len(wanted), 'Missing model-routing test dependency pin'
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *pins])
          PYTHON
      - run: python -m unittest discover -s tests -p 'test_controller_contention.py' -v
      - run: python -m unittest discover -s tests -p 'test_project_retry.py' -v
      - run: python -m unittest discover -s tests -p 'test_model_roles.py' -v
      - run: python -m unittest discover -s tests -p 'test_chat_model_routing.py' -v
      - run: python -m unittest discover -s tests -p 'test_chat_limits.py' -v
      - run: python -m unittest discover -s tests -p 'test_face_detection.py' -v
      - run: python -m unittest tests.test_durability.DurabilityTests.test_sqlite_version_guard -v
      - run: python -m unittest discover -s tests -p 'test_face_grouping_policy.py' -v
      - run: python -m unittest discover -s tests -p 'test_face_maintenance.py' -v
      - run: python -m unittest discover -s tests -p 'test_projection_only.py' -v
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: search
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: viewer
      - run: npm test
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_desktop.py' -v
      - run: python -m unittest discover -s tests -p 'test_bootstrap_paths.py' -v
      - run: python -m unittest discover -s tests -p 'test_volume_resolution.py' -v
      - run: python -m unittest discover -s tests -p 'test_backup*.py' -v
      - run: swift build --jobs 2
        working-directory: native-progress
      - run: swift test --jobs 2
        working-directory: native-progress
